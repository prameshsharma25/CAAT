name: Build and Push to GHCR
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ghcr-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Singularity
        run: |
          sudo apt-get update
          sudo apt-get install -y wget uuid-runtime libgpgme11
          export SY_VER=4.1.1
          wget https://github.com/sylabs/singularity/releases/download/v${SY_VER}/singularity-ce_${SY_VER}-focal_amd64.deb
          sudo apt-get install -y ./singularity-ce_${SY_VER}-focal_amd64.deb

      - name: Build image
        run: sudo singularity build caat.sif images/caat.def

      - name: Fix ownership after sudo build
        run: sudo chown $(whoami) caat.sif

      - name: Set image tag
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | singularity remote login \
            --username "${{ github.actor }}" \
            --password-stdin \
            oras://ghcr.io

      - name: Push to GHCR (SHA tag)
        run: |
          singularity push caat.sif oras://ghcr.io/prameshsharma25/caat:${{ steps.vars.outputs.sha_short }}

      - name: Push to GHCR (latest tag)
        if: github.ref == 'refs/heads/main'
        run: |
          singularity push caat.sif oras://ghcr.io/prameshsharma25/caat:latest