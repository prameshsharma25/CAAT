name: Build and Push to Sylabs
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sylabs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Build, Auth, and Push
        env:
          SYLABS_TOKEN: ${{ secrets.SYLABS_TOKEN }}
        run: |
          apptainer build caat.sif images/caat.def

          echo "$SYLABS_TOKEN" > .sylabs-token
          chmod 600 .sylabs-token
          
          apptainer remote add --no-login SylabsCloud cloud.sylabs.io
          apptainer remote use SylabsCloud
          apptainer remote login --tokenfile .sylabs-token SylabsCloud

          apptainer delete -F library://prameshsharma25/caat-project/caat:latest || echo "Nothing to delete"

          apptainer -v push -U caat.sif library://prameshsharma25/caat-project/caat:latest

          rm .sylabs-token
