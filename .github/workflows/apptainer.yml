name: Build and Push to Sylabs
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sylabs-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer

      - name: Login to Sylabs Cloud
        run: |
          echo "${{ secrets.SYLABS_TOKEN }}" | apptainer registry login --password-stdin cloud.sylabs.io

      - name: Clean up old image
        run: |
          apptainer library delete -f library://prameshsharma25/caat-project/caat:latest || echo "No existing image to delete"

      - name: Build SIF Image
        run: apptainer build caat.sif images/caat.def

      - name: Push to Sylabs Library
        run: apptainer push caat.sif library://sharmapk/caat/caat:latest
